name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Skip the audit and funding requests: the audit call has been hanging until npm times it out after 5 minutes.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # The browser download is the slowest step, so keep it across runs, keyed on the installed Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      # The cache holds the browser only, so a hit still needs its system packages.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - run: npm run test:e2e
