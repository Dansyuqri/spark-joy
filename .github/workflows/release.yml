name: Release

on:
  push:
    tags: ["v*"]
  # Run from the Actions tab: bumps package.json, pushes the commit and tag, then publishes.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The manual run pushes the version commit and tag.
      contents: write
      # Trusted publishing: npm verifies this workflow's OIDC token instead of a stored secret.
      id-token: write
    steps:
      - name: Manual releases run from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main, not $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # Tags pushed with GITHUB_TOKEN don't start other runs, so this run publishes too.
      - name: Bump version, push commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$(npm version "$BUMP" -m "Release %s")"
          git push --atomic origin HEAD:main "$tag"
      - run: npm publish
