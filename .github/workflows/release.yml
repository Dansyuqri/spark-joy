name: Release

on:
  push:
    tags: ["v*"]
  # Run from the Actions tab: bumps the version, pushes the tag, publishes, then opens a PR
  # that brings the bump to main. Nothing is pushed to main, so branch rules don't block it.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The manual run pushes the version tag and branch, then opens the version PR.
      contents: write
      pull-requests: write
      # Trusted publishing: npm verifies this workflow's OIDC token instead of a stored secret.
      id-token: write
    steps:
      - name: Manual releases run from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main, not $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          # The manual run needs existing tags to find the last released version.
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # Tags pushed with GITHUB_TOKEN don't start other runs, so this run publishes too.
      - name: Bump version, push tag and branch
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Start from the newest of the last tag and package.json, in case a version PR is still open.
          current="$(node -p "require('./package.json').version")"
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          base="$(printf '%s\n' "$current" "${latest#v}" | sort -V | tail -n 1)"
          npm version "$base" --no-git-tag-version --allow-same-version
          tag="$(npm version "$BUMP" --no-git-tag-version)"
          git commit -am "Release ${tag#v}"
          git tag "$tag"
          git push origin "refs/tags/$tag" "HEAD:refs/heads/release/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm publish
      - name: Open PR to bring the version bump to main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh pr create --base main --head "release/$TAG" \
            --title "Release ${TAG#v}" \
            --body "Bumps package.json to ${TAG#v}, which was tagged $TAG and published to npm."
