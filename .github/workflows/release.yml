name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Trusted publishing: npm verifies this workflow's OIDC token instead of a stored secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
