name: Release

on:
  push:
    tags: ["v*"]
  # Run from the Actions tab: bumps the version, pushes the tag, publishes, then opens a PR
  # that brings the bump to main. Nothing is pushed to main, so branch rules don't block it.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The manual run pushes the version tag and branch, then opens the version PR.
      contents: write
      pull-requests: write
      # Trusted publishing: npm verifies this workflow's OIDC token instead of a stored secret.
      id-token: write
    steps:
      - name: Manual releases run from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main, not $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch tags so a version that's already tagged is spotted.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@11
      # Skip the audit and funding requests: the audit call has been hanging until npm times it out after 5 minutes.
      - run: npm ci --no-audit --no-fund
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # Tags pushed with GITHUB_TOKEN don't start other runs, so this run publishes too.
      - name: Bump version, push tag and branch
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          name="$(node -p "require('./package.json').name")"
          tag="$(npm version "$BUMP" --no-git-tag-version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@${tag#v}" version 2>/dev/null || true)" ]; then
            echo "$name@${tag#v} is already on npm. Merge its version PR into main, then run this again."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            # An earlier run tagged this version but never published it: publish that tag.
            echo "$tag exists but isn't on npm, so this run publishes it."
            git checkout -q -f "$tag"
            if ! git ls-remote --exit-code --heads origin "release/$tag" > /dev/null; then
              git push origin "HEAD:refs/heads/release/$tag"
            fi
          else
            git commit -am "Release ${tag#v}"
            git tag -a "$tag" -m "Release ${tag#v}"
            # Atomic, so a rejected branch push doesn't leave the tag behind.
            git push --atomic origin "refs/tags/$tag" "HEAD:refs/heads/release/$tag"
          fi
      - run: npm publish
      - name: Open PR to bring the version bump to main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if [ -n "$(gh pr list --head "release/$TAG" --state open --json number --jq '.[]')" ]; then
            echo "The version PR for $TAG is already open."
            exit 0
          fi
          gh pr create --base main --head "release/$TAG" \
            --title "Release ${TAG#v}" \
            --body "Bumps package.json to ${TAG#v}, which was tagged $TAG and published to npm."
